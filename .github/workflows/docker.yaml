name: deploy_render
on: [pull_request,push]
jobs: 
    registration_docker:
      name: build and push image docker
      runs-on: ubuntu-latest
      permissions:
        packages: write
        contents: read
        attestations: write
        id-token: write
      steps:
        - name: check out the repo
          uses: actions/checkout@v6
        - name: login docker
          uses: docker/login-action@v4
          with:
              username: ${{secrets.USERNAME_DOCKER}}
              password: ${{secrets.PASSWORD_DOCKER}}
        - name: Build and push the image docker
          id: push
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
        - name: Generate artifact attestation
          uses: actions/attest@v4
          with:
            subject-name: index.docker.io/danizura/api-gestao-dotnet
            subject-digest: ${{ steps.push.outputs.digest }}
            push-to-registry: true
    deploy-Ef: 
      runs-on: ubuntu-latest
      steps:
      - name: verifica codigo
        uses: actions/checkout@v3
      - name: chamar o hook
        run: sleep 2 && curl ${{secrets.HOOK_RENDER_EF}}

